name: Build aici-engine (all platforms)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,   platform: linux-x86_64,   ext: tar.gz, exe: "" }
          - { os: macos-14,       platform: darwin-arm64,   ext: tar.gz, exe: "" }
          - { os: macos-15-intel, platform: darwin-x86_64,  ext: tar.gz, exe: "" }
          - { os: windows-2022,   platform: windows-x86_64, ext: zip,    exe: ".exe" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: executas/aici-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version from the tool manifest
        id: v
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Assemble self-contained bundle (node + code + Chromium)
        run: |
          set -euo pipefail
          B="$RUNNER_TEMP/bundle"
          mkdir -p "$B/app" "$B/browsers" "$GITHUB_WORKSPACE/dist"
          cp index.js browser.js llm.js manifest.json package.json "$B/app/"
          cp -r node_modules "$B/app/node_modules"
          PLAYWRIGHT_BROWSERS_PATH="$B/browsers" npx playwright install --only-shell chromium
          if [ "${{ matrix.platform }}" = "windows-x86_64" ]; then
            mkdir -p "$B/node"
            cp "$(command -v node)" "$B/node/node.exe"
            gcc -O2 -municode -o "$B/aici-engine.exe" packaging/launcher.c
          else
            mkdir -p "$B/node/bin"
            cp "$(command -v node)" "$B/node/bin/node"
            cp packaging/aici-engine.sh "$B/aici-engine"
            chmod +x "$B/aici-engine" "$B/node/bin/node"
          fi
          OUT="$GITHUB_WORKSPACE/dist/aici-engine-${{ steps.v.outputs.version }}-${{ matrix.platform }}.${{ matrix.ext }}"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            (cd "$B" && 7z a -tzip -bso0 "$OUT" aici-engine.exe node app browsers)
          else
            tar -czf "$OUT" -C "$B" aici-engine node app browsers
          fi
          ls -lh "$OUT"

      - name: Smoke test the packaged build
        run: |
          set -eu
          # macOS has no `timeout`; fall back to perl (preinstalled) so the test runs everywhere
          if ! command -v timeout >/dev/null 2>&1; then
            timeout() { perl -e "alarm shift; exec @ARGV" "$@"; }
          fi
          VER="${{ steps.v.outputs.version }}"
          ARCHIVE="$GITHUB_WORKSPACE/dist/aici-engine-$VER-${{ matrix.platform }}.${{ matrix.ext }}"
          T="$RUNNER_TEMP/smoke"; mkdir -p "$T/site" "$T/x"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            7z x -bso0 -o"$T/x" "$ARCHIVE"
          else
            tar -xzf "$ARCHIVE" -C "$T/x"
          fi
          printf '%s' '<!DOCTYPE html><html><body><script>window.onload=function(){processSystemPayloadData();};</script></body></html>' > "$T/site/broken.html"
          (cd "$T/site" && nohup python3 -m http.server 8080 --bind 127.0.0.1 >/dev/null 2>&1 &) || true
          sleep 3
          BIN="$T/x/aici-engine${{ matrix.exe }}"
          D=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"describe"}' | timeout 30 "$BIN" | head -n1)
          echo "describe: $D" | cut -c1-200
          echo "$D" | grep -q '"run_audit"'
          A=$( (printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"invoke","params":{"tool":"run_audit","arguments":{"targetUrl":"http://127.0.0.1:8080/broken.html"}}}'; sleep 30) | AICI_ALLOW_LOCAL=1 timeout 60 "$BIN" | head -n1 )
          echo "audit: $A" | cut -c1-500
          echo "$A" | grep -q '"crashCount":1'

      - name: Keep the archive as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: aici-engine-${{ matrix.platform }}
          path: dist/*.${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish all four archives to one GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./executas/aici-engine/manifest.json').version")
          TAG="executa-v$VER"
          ls -lh dist
          gh release create "$TAG" dist/* --repo "${{ github.repository }}" --title "aici-engine $VER" --notes "Linux, macOS (arm64 + x64) and Windows builds of the AI-CI executa" \
            || gh release upload "$TAG" dist/* --repo "${{ github.repository }}" --clobber